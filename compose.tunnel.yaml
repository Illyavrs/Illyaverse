# Cloudflare Tunnel deployment: no host ports are published; cloudflared reaches Caddy over the Compose network.
# Requires Docker Compose 2.24.4+ for !override/!reset.
# Use instead of compose.production.yaml:
#   docker compose -f compose.yaml -f compose.tunnel.yaml up -d --build --wait
services:
  sanctuary:
    environment:
      PUBLIC_ORIGIN: https://${ILLYA_DOMAIN:?Set your real ILLYA_DOMAIN}
      COOKIE_SECURE: "true"
  resonance:
    environment:
      PUBLIC_ORIGIN: https://${ILLYA_DOMAIN:?Set your real ILLYA_DOMAIN}
    ports: !reset []
  caddy:
    environment:
      ILLYA_DOMAIN: ${ILLYA_DOMAIN:?Set your real ILLYA_DOMAIN}
    ports: !reset []
    volumes:
      - ./infra/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8088/healthz]
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN from the Cloudflare Zero Trust dashboard}
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.91.12
