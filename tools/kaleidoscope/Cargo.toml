[package]
name = "kaleidoscope"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Preview-first Illyaverse connection profile and managed hosts tool"
license = "MIT"

[dependencies]
fs2 = "0.4"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
