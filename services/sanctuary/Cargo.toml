[package]
name = "sanctuary"
version = "0.1.0"
edition = "2024"

[dependencies]
illya-domain = { path = "../../crates/illya-domain" }
resonance-protocol = { path = "../../crates/resonance-protocol" }
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit", "set-header"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rosu-pp = "4"
zip = { version = "2", default-features = false, features = ["deflate"] }
md5 = "0.7"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
futures-util = "0.3"
ipnet = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
