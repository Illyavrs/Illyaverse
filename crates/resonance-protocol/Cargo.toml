[package]
name = "resonance-protocol"
version = "0.1.0"
edition = "2024"
description = "Bounded osu! stable and lazer protocol primitives for Illyaverse"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
simple-rijndael = "0.3.2"
md5 = "0.7"
chrono = "0.4"
lzma-rs = "0.3"
rmpv = { version = "1", features = ["with-serde"] }
