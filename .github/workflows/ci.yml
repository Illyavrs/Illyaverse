name: Illyaverse CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: illya
          POSTGRES_PASSWORD: illyaverse-ci-only
          POSTGRES_DB: illyaverse_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U illya -d illyaverse_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo test -p sanctuary persistence_and_permissions --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance signalr_http_websocket_and_sse --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance native_chat_http_and_websocket --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance native_replay_http_websocket_persistence --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p sanctuary extended_replay_upload_permissions_and_idempotency --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p sanctuary score_scale_ingestion_recovery_and_privacy --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p sanctuary account_recovery_security --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p sanctuary profile_media_removal_persistence_and_queued_authorization --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p sanctuary native_map_resolution_imports_cache_and_integrity --locked -- --ignored
        env:
          ILLYA_NATIVE_MAP_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance native_map_tests --locked -- --ignored --test-threads=1
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p sanctuary durable_mail_queue_leases_retries_and_cleanup --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance mixed_score_aggregates_use_display_values_after_standardised_selection --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance credential_race_tests --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance social_session_tests --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p sanctuary rbac_tests --locked -- --ignored
        env:
          ILLYA_RBAC_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p sanctuary relax_tests --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance relax_partitions_native_profiles_boards_rankings_and_replays --locked -- --ignored
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo test -p resonance room_score_tests --locked -- --ignored --test-threads=1
        env:
          ILLYA_TEST_DATABASE_URL: postgres://illya:illyaverse-ci-only@localhost:5432/illyaverse_ci
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  serendipity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:migrations
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  kaleidoscope-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @illyaverse/kaleidoscope
      - run: npm run typecheck --workspace @illyaverse/kaleidoscope
      - run: npm run build --workspace @illyaverse/kaleidoscope

  kaleidoscope-native-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kaleidoscope --locked
      - run: ./tools/kaleidoscope/tests/runtime-host.ps1
        shell: pwsh
      - run: npm ci
      - run: npm run build --workspace @illyaverse/kaleidoscope
      - run: cargo build --manifest-path apps/kaleidoscope/src-tauri/Cargo.toml --release --locked --features custom-protocol
      - name: Verify embedded production interface without opening a window
        shell: pwsh
        run: |
          $launcher = Join-Path $pwd 'apps/kaleidoscope/src-tauri/target/release/kaleidoscope-desktop.exe'
          $proof = Start-Process -FilePath $launcher -ArgumentList '--verify-embedded-interface' -WindowStyle Hidden -Wait -PassThru
          if ($proof.ExitCode -ne 0) { throw 'Embedded production interface proof failed.' }

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh infra/setup.sh
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.client-test.yaml config --quiet
      - run: node infra/validate-compose.mjs
      - run: node --test infra/protocol-smoke.test.mjs
      - run: node --test infra/tests/disposable-web-smoke.test.mjs
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/v1/status
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node infra/disposable-web-smoke.mjs
        env:
          ILLYA_ALLOW_DISPOSABLE_TEST: '1'
      - run: python3 -m venv .protocol-venv
      - run: .protocol-venv/bin/python -m pip install -r services/resonance/tests/requirements.txt
      - run: node infra/protocol-smoke.mjs
        env:
          ILLYA_ALLOW_DISPOSABLE_TEST: '1'
      - if: always()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
