name: Publish container images

# Images are built here, never on the server. Deploy by pulling them (see compose.images.yaml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: sanctuary
            dockerfile: services/sanctuary/Dockerfile
          - service: resonance
            dockerfile: services/resonance/Dockerfile
          - service: serendipity
            dockerfile: apps/serendipity/Dockerfile
            build_args: |
              API_INTERNAL_URL=http://sanctuary:8080
              RESONANCE_INTERNAL_URL=http://resonance:8081
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ghcr.io/illyavrs/illyaverse-${{ matrix.service }}:latest
            ghcr.io/illyavrs/illyaverse-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
