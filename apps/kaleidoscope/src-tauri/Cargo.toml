[package]
name = "kaleidoscope-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Illyaverse fixed-server client launcher"

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
kaleidoscope = { path = "../../../tools/kaleidoscope" }

